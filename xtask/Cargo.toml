[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Repository-local structural gates."
readme = "README.md"
publish = false

[package.metadata.sim]
role = "host-tool"

[dependencies]
sim-kernel = "0.4.0"
sim-lib-compute-cli = "0.3.0"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }
sha2 = "0.10"
sim-codec-binary = "0.4.0"
sim-lib-exec = "0.5.0"
sim-platform-linux = { version = "0.1.0", path = "../crates/sim-platform-linux" }
sim-platform-ubuntu-pc = { version = "0.3.1", path = "../crates/sim-platform-ubuntu-pc" }

[lints]
workspace = true
