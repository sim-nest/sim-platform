schema = "sim.features"

[enforcement.audience]
user = "strict"
framework = "strict"
code = "strict"

[enforcement.specimen]
user = "strict"
framework = "strict"
code = "strict"

[enforcement.route]
major_entrypoints = "strict"
frameworks = "strict"

[[feature]]
id = "feature/sim-platform/platform-owner"
title = "Platform capsule owner"
summary = "Own and validate platform capsule and content-bound bundle manifests without granting host authority."
owner = "crate/sim-platform-core"
audiences = ["code", "framework"]
guidance = "Load sim-lib-platform for the closed thirteen-function Small SIM API, then bind platform/active-site in the current realization environment. Use the shaped records and pure resolver for provider-neutral selection; never resolve a global host, synthesize an unbound CPU fallback, or wrap canonical domain refs."
claims_anchors = ["anchor/crate/sim-platform-core", "anchor/crate/sim-platform-model", "anchor/crate/sim-lib-platform", "anchor/crate/sim-platform-bootstrap"]

[[feature]]
id = "feature/sim-platform/platform-policy"
title = "Deterministic platform policy and modeled site"
summary = "Resolve explicit cross-domain fact services atomically and execute against a seeded, host-free EvalFabric site."
owner = "crate/sim-platform-core"
audiences = ["code", "framework"]
guidance = "Compose open platform records, evidence thresholds, and ordered substitutes through platform_require. The facade checks capability before provider permission and sends bounded local-only requests to the lexically active PlatformSite. Tests should inject SeededPlatform services; missing bindings are Unsupported and every modeled clock, entropy, lifecycle, limit, mount, receipt, and ledger reference is deterministic."
claims_anchors = ["anchor/crate/sim-platform-core", "anchor/crate/sim-platform-model", "anchor/crate/sim-lib-platform", "spec-test/sim-platform/crates/sim-platform-core/tests/policy"]

[[feature]]
id = "feature/sim-platform/bootstrap-rind"
title = "Content-bound platform bootstrap rind"
summary = "Admit one exact adjacent platform bundle and capsule through the existing native ABI without ambient discovery."
owner = "crate/sim-platform-bootstrap"
audiences = ["code", "framework"]
guidance = "Supply BootstrapEnvelope, BootstrapPolicy, executable location, and kernel context explicitly. The rind reads only sim.platform-bundle.toml plus its named capsule card and artifact, verifies content and authority, then delegates to the existing native loader without fallback."
claims_anchors = ["anchor/crate/sim-platform-bootstrap"]
supports = ["feature/sim-platform/platform-owner"]

[[feature]]
id = "feature/sim-platform/ubuntu-pc-capsule"
title = "Ubuntu PC reference capsule"
summary = "Provide explicit desktop and headless Ubuntu Cards over bounded Linux mechanics, with deterministic entropy and sanitized physical evidence."
owner = "crate/sim-platform-ubuntu-pc"
audiences = ["code", "framework"]
guidance = "Register an UbuntuPcProfile as Card data, inject preopened XDG roots and a Portal implementation, then drive Capsule requests through explicit grants and budgets. Headless Cards omit desktop offers so platform/require returns Unsupported; neither provider probes or falls back."
claims_anchors = ["anchor/crate/sim-platform-linux", "anchor/crate/sim-platform-ubuntu-pc", "spec-test/sim-platform/crates/sim-platform-ubuntu-pc/tests/conformance", "spec-test/sim-platform/acceptance/ubuntu-pc"]
supports = ["feature/sim-platform/platform-owner", "feature/sim-platform/bootstrap-rind", "feature/sim-platform/platform-policy"]

[[route]]
id = "route/author-platform-provider"
task = "Author a platform provider"
audiences = ["code", "framework"]
steps = [
  { feature = "feature/sim-platform/platform-owner", why = "The sole owner validates capsule identity, declared services and shells, canonical bootstrap use, and product-closure isolation before any real provider can be claimed." },
  { feature = "feature/sim-platform/bootstrap-rind", why = "The bounded rind admits only the content-bound adjacent capsule through the stable native ABI." },
  { feature = "feature/sim-platform/platform-policy", why = "The pure resolver and modeled site provide the reusable service-selection and deterministic conformance surface." },
]
