schema = "sim.features"

[[feature]]
id = "feature/sim-platform/attesting-sqlite-relation-site"
title = "Attesting SQLite relation capsule"
summary = "Realize checked relation plans against bounded memory or preopened SQLite stores with typed values, atomic migration attestations, normalized introspection, safe attach, and stable failures."
owner = "crate/sim-platform-sqlite"
audiences = ["code", "framework"]
guidance = "Load relation/site:sqlite only through SqliteDriver and a closed StorageLocator. The capsule is the sole rusqlite owner; compose sim-codec-sql lowering and the storage relation site instead of exposing SQL, paths, statements, or driver values."
claims_anchors = ["anchor/crate/sim-platform-sqlite"]
supports = ["feature/sim-storage/bounded-relation-site", "feature/sim-storage/sqlite-relation-locator", "feature/sim-codecs/sql-projection"]

[[feature]]
id = "feature/sim-platform/construction-integration-realization"
title = "Construction integration platform realization"
summary = "Realize Dalux HTTPS and Powerproject desktop automation behind construction-owned ports."
owner = "crate/sim-platform-construction"
audiences = ["code", "framework"]
guidance = "Inject UreqDaluxTransport or PowerprojectBridge only while activating a platform capsule. Construction retains request validation, capability gates, response interpretation, and project policy; the capsule owns HTTP, native process launch, bounded response reads, and typed host failures. Use deterministic construction transports for denial and fault tests."
claims_anchors = ["anchor/crate/sim-platform-construction"]
supports = ["feature/sim-construction/dalux-project-items", "feature/sim-construction/powerproject-schedule-placement"]

[[feature]]
id = "feature/sim-platform/device-physical-port"
title = "Capsule-owned physical device transport"
summary = "Own VITURE SDK loading, USB discovery, native handles, lifecycle, bounded queues, and modeled transport behind DevicePhysicalPort."
owner = "crate/sim-viture-ffi"
audiences = ["code", "framework"]
guidance = "Compose this capsule port under stream-host DeviceProvider implementations. Keep profiles, consent, retention, timing, staleness, placement, and stream samples in sim-stream-host; never load a vendor SDK or probe a device path there."
claims_anchors = ["anchor/crate/sim-viture-ffi"]
supports = ["feature/sim-stream-host/hardware-host-surfaces"]

[enforcement.audience]
user = "strict"
framework = "strict"
code = "strict"

[enforcement.specimen]
user = "strict"
framework = "strict"
code = "strict"

[enforcement.route]
major_entrypoints = "strict"
frameworks = "strict"

[[feature]]
id = "feature/sim-platform/native-midi-realization"
title = "Capsule-owned native MIDI realization"
summary = "Ubuntu and deterministic platform ports realize BlueZ and RtMidi endpoints behind the music-owned MidiPort contract."
owner = "crate/sim-platform-midi"
audiences = ["framework"]
guidance = "Bind only capsule-registered BlueZ BLE-MIDI or RtMidi ALSA/CoreMIDI/WinMM endpoints. Consumers use sim-lib-midi-core MidiPort Cards and typed refusals; unknown or absent hardware is Unsupported and never triggers backend probing or fallback."
claims_anchors = ["anchor/crate/sim-platform-midi"]

[[feature]]
id = "feature/sim-platform/platform-owner"
title = "Platform capsule owner"
summary = "Compose one selected capsule with explicit application and library content into a pure runtime bundle."
owner = "crate/sim-platform-core"
audiences = ["code", "framework"]
guidance = "Call compose_bundle with one selected capsule id, explicit application/library content ids, retained Cards and matching attestations. It emits one PureBootEnvelope and one CapsuleArtifact, rejects authority or evidence drift, and never chooses a substitute provider. Generate support matrices only with platform_support_matrix so contract provenance and execution evidence remain separate."
claims_anchors = ["anchor/crate/sim-platform-core", "anchor/crate/sim-platform-model", "anchor/crate/sim-lib-platform", "anchor/crate/sim-platform-bootstrap"]

[[feature]]
id = "feature/sim-platform/platform-policy"
title = "Deterministic platform policy and modeled site"
summary = "Resolve explicit cross-domain fact services atomically and execute against a seeded, host-free EvalFabric site."
owner = "crate/sim-platform-core"
audiences = ["code", "framework"]
guidance = "Compose open platform records, evidence thresholds, and ordered substitutes through platform_require. The facade checks capability before provider permission and sends bounded local-only requests to the lexically active PlatformSite. Tests should inject SeededPlatform services; missing bindings are Unsupported and every modeled clock, entropy, lifecycle, limit, mount, receipt, and ledger reference is deterministic."
claims_anchors = ["anchor/crate/sim-platform-core", "anchor/crate/sim-platform-model", "anchor/crate/sim-lib-platform"]

[[feature]]
id = "feature/sim-platform/bootstrap-rind"
title = "Content-bound platform bootstrap rind"
summary = "Admit one exact adjacent platform bundle and capsule through the existing native ABI without ambient discovery."
owner = "crate/sim-platform-bootstrap"
audiences = ["code", "framework"]
guidance = "Supply BootstrapEnvelope, BootstrapPolicy, executable location, and kernel context explicitly. The rind reads only sim.platform-bundle.toml plus its named capsule card and exact artifact, verifies content, loader-kind support, and authority, then delegates to the first native loader without fallback. Subsequent libraries use LoaderPort."
claims_anchors = ["anchor/crate/sim-platform-bootstrap"]
supports = ["feature/sim-platform/platform-owner"]

[[feature]]
id = "feature/sim-platform/ubuntu-pc-capsule"
title = "Ubuntu PC reference capsule"
summary = "Provide explicit desktop and headless Ubuntu Cards over bounded Linux mechanics, including the full post-bootstrap loader service."
owner = "crate/sim-platform-ubuntu-pc"
audiences = ["code", "framework"]
guidance = "Register an UbuntuPcProfile as Card data, inject preopened XDG roots and a Portal implementation, then drive Capsule requests through explicit grants and budgets. Install UbuntuLoaderPort after the narrow first-capsule bootstrap: its advertised exact kinds realize native, wasm, source, and static artifacts without bootloader target logic. Headless Cards omit desktop offers so platform/require returns Unsupported; neither provider probes or falls back."
claims_anchors = ["anchor/crate/sim-platform-linux", "anchor/crate/sim-platform-ubuntu-pc"]
supports = ["feature/sim-platform/platform-owner", "feature/sim-platform/bootstrap-rind", "feature/sim-platform/platform-policy"]

[[feature]]
id = "feature/sim-platform/macos-capsule"
title = "macOS platform capsule"
summary = "Realize the frozen platform and domain ports through documented macOS frameworks and one deterministic unsigned application bundle."
owner = "crate/sim-platform-macos"
audiences = ["code", "framework"]
guidance = "Activate MacosCapsule with explicit capability grants and an injected NativeServices implementation. Permission status is observational and cannot prompt; request_permission is the only prompt path and refuses a missing matching SIM capability before entering native code. Build both Apple architectures from the same content-bound CapsuleInput, keep AppKit/CoreServices/Security/CoreAudio/CoreMIDI/Metal and entitlement mechanics in this package, and load the resulting ordinary platform Site through sim_native_abi_v1."
claims_anchors = ["anchor/crate/sim-platform-macos"]
supports = ["feature/sim-platform/platform-owner", "feature/sim-platform/bootstrap-rind", "feature/sim-platform/platform-policy", "feature/sim-platform/native-media-realization"]

[[feature]]
id = "feature/sim-platform/android-capsule"
title = "Android AOT platform capsule"
summary = "Host the unchanged native ABI as AOT Rust behind one thin Kotlin lifecycle and activation shell."
owner = "crate/sim-platform-android"
audiences = ["code", "framework"]
guidance = "Cross-build the four declared Rust Android targets with the provenance-pinned LTS NDK. Bind the complete service set atomically against one immutable provider snapshot and restore continuity only from content ids plus journal records. For admitted audio sessions, report privacy-safe capture and render route classes independently, preserve canonical bounded PCM and timing evidence, and use the API 28-30 communication-mode or API 31-35 communication-device observation contract only while armed. Advertise transcribe or speak only for explicitly on-device implementations with installed language support after a network-denied self-test; discovery must not prompt, download, or contact a provider, and a remotely backed recognizer is never local. Preserve PCM and plain transcript contracts, return typed unsupported fallbacks, and reap speech on every authority, route, lifecycle, or bounds failure. Android and the user own pairing and route choice; never export device identity, command a headset, or infer input from output. Rotation, recreation, restrictions, suspension, permission or route loss, process death, restart, and memory pressure enter Rust as explicit events and release focus and communication routing. The Kotlin Activity is only a bounded byte-frame callback pump; it owns no retry, policy, ranking, transcript, session, permission-prompt, pairing, or task-stack state."
claims_anchors = ["anchor/crate/sim-platform-android"]
supports = ["feature/sim-platform/platform-owner", "feature/sim-platform/bootstrap-rind", "feature/sim-platform/platform-policy", "feature/sim-platform/native-media-realization"]

[[feature]]
id = "feature/sim-platform/amazfit-proxy-capsule"
title = "Amazfit bounded proxy capsule"
summary = "Model a bounded Zepp OS proxy while keeping the unproved watch-to-Android-Rust route explicitly unsupported."
owner = "crate/sim-platform-amazfit"
audiences = ["code", "framework"]
guidance = "Use AmazfitCapsule only as a fail-closed model of versioned, bounded proxy frames. The delivered Zepp manifest has no app-service declaration, its unregistered side-service source does not forward into Android, and the Android capsule has no Amazfit adapter, so do not advertise watch-provider, continuity, worn-view, glance, haptic, or input support. Physical support requires an official local handoff, an explicit Android-to-Rust adapter, exact device and firmware evidence, and a round trip attested with Wi-Fi and cellular disabled."
claims_anchors = ["anchor/crate/sim-platform-amazfit"]
supports = ["feature/sim-platform/android-capsule", "feature/sim-stream-host/hardware-host-surfaces", "feature/sim-web/device-surfaces"]

[[feature]]
id = "feature/sim-platform/ios-capsule"
title = "iOS AOT platform capsule"
summary = "Host the unchanged native ABI as statically linked Rust behind one thin Swift scene shell."
owner = "crate/sim-platform-ios"
audiences = ["code", "framework"]
guidance = "Cross-build the device and simulator Rust targets from the pinned compiler contract, then import sim_platform_ios.h from Swift and call sim_native_abi_v1 directly. Keep UIScene sessions, security-scoped URL lifetime, permission callbacks, notification and AVAudioSession glue, memory pressure, and background limits in this package. Suspension releases grants and resources; unavailable services refuse without fallback or a hidden worker."
claims_anchors = ["anchor/crate/sim-platform-ios"]
supports = ["feature/sim-platform/platform-owner", "feature/sim-platform/bootstrap-rind", "feature/sim-platform/platform-policy", "feature/sim-platform/native-media-realization"]

[[feature]]
id = "feature/sim-platform/halo-proxy-capsule"
title = "Halo official-contract proxy capsule"
summary = "Bridge the official Halo host SDK and minimal Lua loop to existing GLASSES_8 Device/Stream and Surface contracts."
owner = "crate/sim-platform-halo"
audiences = ["code", "framework"]
guidance = "Host Halo in an explicitly selected Android, iOS, or Web Bluetooth capsule and use the one bounded application codec for every route. Normalize inputs for GLASSES_8 and accept only bounded Surface commands. The Lua shell handles vendor callbacks and display primitives only; it owns no evaluator, routing policy, persistence, or glasses-specific application API. Treat committed model/cross-build evidence as built-unattested until a registered physical Halo run exists."
claims_anchors = ["anchor/crate/sim-platform-halo"]
supports = ["feature/sim-platform/android-capsule", "feature/sim-platform/ios-capsule", "feature/sim-platform/browser-capsule", "feature/sim-stream-host/hardware-host-surfaces", "feature/sim-web/device-surfaces"]

[[feature]]
id = "feature/sim-platform/ubuntu-rpi-capsule"
title = "Ubuntu Raspberry Pi capsule"
summary = "Provide an evidence-graded, headless Raspberry Pi Card whose device bindings come only from an explicit board profile."
owner = "crate/sim-platform-ubuntu-rpi"
audiences = ["code", "framework"]
guidance = "Derive UbuntuRpiProfile from the Ubuntu headless profile, then declare GPIO, serial, I2C, SPI, audio, network, storage, process, and compute independently. Keep board revision, device paths, permissions, and declared absences in the profile. Consumers request domain services and receive typed Unsupported refusals; they never branch on Raspberry Pi identity. Cross-build attestations are cross-built, not physical, until a registered Pi host performs the hardware checks."
claims_anchors = ["anchor/crate/sim-platform-linux", "anchor/crate/sim-platform-ubuntu-pc", "anchor/crate/sim-platform-ubuntu-rpi"]
supports = ["feature/sim-platform/ubuntu-pc-capsule", "feature/sim-platform/platform-owner", "feature/sim-platform/platform-policy"]

[[feature]]
id = "feature/sim-platform/windows-capsule"
title = "Windows platform capsule"
summary = "Realize frozen platform and domain ports through bounded Win32 and WinRT mechanics and one content-bound package."
owner = "crate/sim-platform-windows"
audiences = ["code", "framework"]
guidance = "Activate WindowsCapsule with explicit preopened roots, capability grants, process/output budgets, and an injected NativeServices implementation. Keep drive, separator, UTF-16, package identity, permission, Win32/WinRT selection, job-object, and artifact-suffix policy inside this crate. Consume only Card service identities and load the package through sim_native_abi_v1; cross-build evidence does not claim hosted or physical execution."
claims_anchors = ["anchor/crate/sim-platform-windows"]
supports = ["feature/sim-platform/platform-owner", "feature/sim-platform/bootstrap-rind", "feature/sim-platform/platform-policy", "feature/sim-platform/native-media-realization"]

[[feature]]
id = "feature/sim-platform/process-realization"
title = "Modeled and Ubuntu process realization"
summary = "Realize runtime-owned ProcessPort requests through a deterministic model or confined Ubuntu process tree."
owner = "crate/sim-platform-ubuntu-pc"
audiences = ["code", "framework"]
guidance = "Use ModelProcess for portable dispatch-boundary and race tests and UbuntuProcess only at the physical capsule boundary. Boot configuration maps opaque program, project-root, and private-artifact references to native resources. The Ubuntu capsule clears the environment, renders only sealed bindings, marks dispatch at successful spawn, and reports timeout or cancellation as stopped only after process-group kill and reap; every post-spawn ambiguity is UnknownAfterDispatch."
claims_anchors = ["anchor/crate/sim-platform-model", "anchor/crate/sim-platform-ubuntu-pc"]
supports = ["feature/sim-platform/ubuntu-pc-capsule", "feature/sim-runtime/host-exec"]

[[feature]]
id = "feature/sim-platform/ubuntu-bwrap-sandbox"
title = "Ubuntu bubblewrap sandbox realization"
summary = "Realize the runtime sandbox contract with an anonymous root, network namespace, declared mounts, rlimits, bounded pipes, and proven process-tree cleanup."
owner = "crate/sim-platform-ubuntu-pc"
audiences = ["code", "framework"]
guidance = "Register BwrapLauncher only from boot-authorized bwrap, prlimit, program, input, toolchain, and writable-root paths. Missing mechanics or resource identities refuse before spawn. The launcher clears the environment, exposes no ambient home or workspace, binds only canonical declared sources, applies CPU/address-space/process/file-size limits, and composes the Ubuntu process-group monitor for wall time, cancellation, capture, and descendant cleanup."
claims_anchors = ["anchor/crate/sim-platform-ubuntu-pc"]
claims_specimens = ["spec-test/sim-platform/crates/sim-platform-ubuntu-pc/src/sandbox"]
supports = ["feature/sim-platform/process-realization", "feature/sim-runtime/sandbox-exec"]

[[feature]]
id = "feature/sim-platform/transport-realization"
title = "Ubuntu socket, DNS, and local IPC realization"
summary = "Realize agent-net transport ports inside the Linux capsule with typed native failures and explicit platform-specific IPC identities."
owner = "crate/sim-platform-linux"
audiences = ["code", "framework"]
guidance = "Bind LinuxSocketPort, LinuxDnsPort, optional LinuxIpcPort, and LinuxWallClock at capsule activation. Protocol crates consume only sim-transport-ports and sim-lib-server traits; physical loopback, wall-time observation, and native-error conformance stay in this capsule."
claims_anchors = ["anchor/crate/sim-platform-linux"]
supports = ["feature/sim-platform/ubuntu-pc-capsule"]

[[route]]
id = "route/author-platform-provider"
task = "Author a platform provider"
audiences = ["code", "framework"]
steps = [
  { feature = "feature/sim-platform/platform-owner", why = "The sole owner validates capsule identity, declared services and shells, canonical bootstrap use, and product-closure isolation before any real provider can be claimed." },
  { feature = "feature/sim-platform/bootstrap-rind", why = "The bounded rind admits only the content-bound adjacent capsule through the stable native ABI." },
  { feature = "feature/sim-platform/platform-policy", why = "The pure resolver and modeled site provide the reusable service-selection and deterministic conformance surface." },
]

[[feature]]
id = "feature/sim-platform/web-shell-realization"
title = "Native web shell realization"
summary = "Realize the host-neutral web shell through Linux-owned process, transport, mount, time, entropy, and external-open services."
owner = "crate/sim-platform-web-shell"
audiences = ["code", "framework"]
guidance = "Launch the sim-web-shell process from this capsule when a native Linux host is required. The capsule supplies only ShellServices and the bootloader process rind; sim-web retains SurfaceCodec, Scene, Intent, remote-session, and layout policy. Tests should inject ModelShellServices and modeled transport instead of reaching native files, sockets, clocks, entropy, or browser APIs."
claims_anchors = ["anchor/crate/sim-platform-web-shell"]
supports = ["feature/sim-platform/transport-realization", "feature/sim-web/web-shell-host"]

[[feature]]
id = "feature/sim-platform/browser-capsule"
title = "Capability-honest browser Wasm capsule"
summary = "Realize detected browser lifecycle, storage, transport, clipboard, notification, permission, and wake-lock APIs through canonical framed named calls."
owner = "crate/sim-platform-browser"
audiences = ["code", "framework"]
guidance = "Load sim-platform-browser as a Wasm capsule and derive its Card only from APIs detected by the window or worker shell. The JavaScript membrane copies bytes and performs Rust-selected host calls; it owns no SIM routing or presentation policy. Keep DOM, Canvas, WebGPU, Scene, Intent, SurfaceCodec, and render trees in sim-web. Missing APIs and denied permissions fail closed, and stopped or suspended capsules release every pending call and handle."
claims_anchors = ["anchor/crate/sim-platform-browser"]
supports = ["feature/sim-platform/platform-owner", "feature/sim-web/view-surface"]

[[feature]]
id = "feature/sim-platform/wasi-capsule"
title = "Least-authority WASI component capsule"
summary = "Inspect a closed WASI import surface and realize it through explicit Table/Dir and canonical platform or domain ports."
owner = "crate/sim-platform-wasi"
audiences = ["code", "framework"]
guidance = "Admit a component only after every import matches the capsule declaration, then activate it with the complete authority bundle: named Table/Dir refs, explicit clocks and entropy, declared socket endpoints, lifecycle, and matching capabilities. Treat in-memory and hosted-runtime frame results as separate evidence grades. Unsupported process creation, native loading, UI, notification, and device services remain absent and refuse without probing."
claims_anchors = ["anchor/crate/sim-platform-wasi", "anchor/card/cookbook/sim-platform-wasi"]
supports = ["feature/sim-platform/platform-owner", "feature/sim-platform/platform-policy"]

[[route]]
id = "route/host-sim-in-browser"
task = "Host SIM in a browser without moving presentation policy into the platform"
audiences = ["code", "framework"]
steps = [
  { feature = "feature/sim-platform/browser-capsule", why = "The browser capsule contributes capability-honest handles and lifecycle events through canonical named-call frames." },
  { feature = "feature/sim-web/view-surface", why = "sim-web remains the sole owner of reversible browser presentation and edit behavior." },
]

[[feature]]
id = "feature/sim-platform/native-compute-probing"
title = "Capsule-owned native compute probing"
summary = "Probe CUDA, ROCm, and wgpu once in the Ubuntu capsule and inject retained results into compute-owned executors."
owner = "crate/sim-platform-ubuntu-pc"
audiences = ["code", "framework"]
guidance = "Construct UbuntuComputeProbe at capsule activation, then pass its CUDA, ROCm, and wgpu probe ports to the matching sim-compute provider constructors. The capsule owns library search, adapter enumeration, vendor and driver observation, gfx target discovery, transfer checks, and physical acceptance invocation; sim-compute retains TensorExecutor policy, site placement, and resident storage."
claims_anchors = ["anchor/crate/sim-platform-ubuntu-pc"]
supports = ["feature/sim-compute/tensor-providers", "feature/sim-platform/ubuntu-pc-capsule"]

[[feature]]
id = "feature/sim-platform/native-media-realization"
title = "Native audio and plugin realization"
summary = "Realize audio-owned device and plugin ports through explicit platform capsule bindings."
owner = "crate/sim-platform-audio"
audiences = ["code", "framework"]
guidance = "Bind only capsule-advertised ALSA, ASIO, CoreAudio, JACK, PipeWire, PortAudio, cpal, LV2, VST3, or CLAP services. Consumers, including wasm ABI adapters, use sim-audio-ports Cards and typed refusals; ABI import names remain declarations while performed callbacks are capsule-owned host facts. Absent APIs are Unsupported, native handles never enter domain code, and callbacks obey the prevalidated nonallocating nonblocking budget."
claims_anchors = ["anchor/crate/sim-platform-audio"]
supports = ["feature/sim-platform/ubuntu-pc-capsule"]

[[feature]]
id = "feature/sim-platform/host-directory-realization"
title = "Modeled and Ubuntu host-directory realization"
summary = "Realize storage-owned HostDirPort semantics, including linearizable leaf compare-exchange, with one deterministic model and one confined Ubuntu adapter."
owner = "crate/sim-table-fs"
audiences = ["code", "framework"]
guidance = "Inject MemoryHostDirPort in portable storage tests and use UbuntuHostDirPort only at the platform capsule boundary. Both run compare-exchange under one atomic boundary; Ubuntu owns its cross-process lock, crash-safe temporary write, sync, atomic replace, and directory sync."
claims_anchors = ["anchor/crate/sim-table-fs"]
supports = ["feature/sim-platform/ubuntu-pc-capsule"]

[[feature]]
id = "feature/sim-platform/ledger-command-realization"
title = "Ledger command platform composition"
summary = "Bind preopened Table/Dir mounts and the active platform clock into the loadable ledger command."
owner = "crate/sim-table-fs"
audiences = ["code", "framework"]
guidance = "Construct ledger command context only from named preopened HostDirPort mounts and the active platform wall-clock service. Use MemoryHostDirPort plus SeededPlatform for product tests; native paths, environment discovery, and temporary directories stay outside ledger libraries and receipts."
claims_anchors = ["anchor/crate/sim-table-fs", "anchor/crate/sim-platform-model"]
supports = ["feature/sim-platform/host-directory-realization", "feature/sim-platform/platform-policy", "feature/sim-ledger/ledger-command"]

[[feature]]
id = "feature/sim-platform/product-membrane"
title = "Platform product membrane"
summary = "Enforce one absolute, evidence-derived boundary between pure products, neutral ports, bootstrap, host tools, and declared capsules."
owner = "crate/sim-lib-platform"
audiences = ["code", "framework"]
guidance = "Start with a neutral sim-host-core primitive and a domain-owned port, prove behavior with the deterministic platform model, then realize it in one declared capsule and retain conformance and attestation evidence. The permanent membrane rejects unclassified targets, unknown binding kinds, undeclared imports, host-tool reachability, duplicate backend ownership, bootstrap growth, and content or support-claim drift; there is no migration baseline or ambient fallback."
claims_anchors = ["anchor/repo/sim-platform"]
supports = ["feature/sim-platform/platform-owner", "feature/sim-platform/bootstrap-rind"]

[[route]]
id = "route/realize-host-need"
task = "Realize a host need through the absolute platform membrane"
audiences = ["code", "framework"]
steps = [
  { feature = "feature/sim-foundation/host-primitives", why = "Begin with the neutral primitive, open identity, bounded refusal, and lexical binding contract." },
  { feature = "feature/sim-storage/host-storage-primitives", why = "Put storage semantics in the domain-owned port; substitute the corresponding domain port for non-storage needs." },
  { feature = "feature/sim-platform/platform-policy", why = "Use the seeded model as the deterministic, host-free behavior specimen before selecting physical mechanics." },
  { feature = "feature/sim-platform/ubuntu-pc-capsule", why = "Implement the need in one explicitly selected capsule whose Card declares the offered service." },
  { feature = "feature/sim-platform/transport-realization", why = "Run the shared port conformance at the capsule boundary so native results are compared semantically." },
  { feature = "feature/sim-platform/platform-owner", why = "Retain the matching Card, artifact, attestation, and evidence-derived support row in the composed bundle." },
]

[[route]]
id = "route/audit-platform-membrane"
task = "Audit every platform membrane realization"
audiences = ["code", "framework"]
steps = [
  { feature = "feature/sim-platform/product-membrane", why = "Begin with the permanent classification, closure, evidence, and ownership gate." },
  { feature = "feature/sim-platform/construction-integration-realization", why = "Check construction integration remains a capsule realization, not domain ownership." },
  { feature = "feature/sim-platform/device-physical-port", why = "Check physical device mechanics remain behind the shared device port." },
  { feature = "feature/sim-platform/native-midi-realization", why = "Check native MIDI mechanics remain behind the music-owned contract." },
  { feature = "feature/sim-platform/process-realization", why = "Check modeled and physical process providers share the runtime-owned port." },
  { feature = "feature/sim-platform/web-shell-realization", why = "Check native web hosting does not absorb presentation policy." },
  { feature = "feature/sim-platform/native-compute-probing", why = "Check hardware probing is injected into compute-owned executors." },
  { feature = "feature/sim-platform/native-media-realization", why = "Check audio and plugin mechanics remain behind media-owned ports." },
  { feature = "feature/sim-platform/host-directory-realization", why = "Check host paths remain confined behind the storage-owned port." },
  { feature = "feature/sim-platform/ledger-command-realization", why = "Check ledger composition consumes only preopened storage and clock services." },
  { feature = "feature/sim-platform/macos-capsule", why = "Verify the macOS Card and cross-build evidence independently." },
  { feature = "feature/sim-platform/windows-capsule", why = "Verify the Windows Card and cross-build evidence independently." },
  { feature = "feature/sim-platform/android-capsule", why = "Verify the Android Card, shell boundary, and target attestations independently." },
  { feature = "feature/sim-platform/ios-capsule", why = "Verify the iOS Card, shell boundary, and target attestations independently." },
  { feature = "feature/sim-platform/wasi-capsule", why = "Verify the declared WASI import surface and modeled/hosted evidence independently." },
  { feature = "feature/sim-platform/ubuntu-rpi-capsule", why = "Keep cross-build and physical Raspberry Pi support grades distinct." },
  { feature = "feature/sim-platform/amazfit-proxy-capsule", why = "Keep the bounded watch proxy separate from Android capsule ownership." },
  { feature = "feature/sim-platform/halo-proxy-capsule", why = "Keep the official-contract glasses proxy separate from its host capsule." },
]
