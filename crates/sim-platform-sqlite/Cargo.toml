[package]
name = "sim-platform-sqlite"
version = "0.2.0"
edition = "2024"
license = "MPL-2.0"
readme = "README.md"
description = "Attesting SQLite relation capsule for SIM."
repository = "https://github.com/sim-nest/sim-platform"
homepage = "https://github.com/sim-nest/sim-platform"
publish = true

[package.metadata.sim-recipes]
policy = "rustdoc"
reason = "Real-file adoption, migration, attach, and bounded execution are checked by conformance tests."

[dependencies]
rusqlite = { version = "0.31", features = ["bundled", "hooks"] }
sim-kernel = { version = "0.4.0" }
sim-codec-sql = { version = "0.2.0" }
sim-relation-core = { version = "0.2.0" }
sim-relation-migrate = { version = "0.2.0" }
sim-relation-plan = { version = "0.2.0" }
sim-relation-schema = { version = "0.2.0" }
sim-relation-site = { version = "0.2.0" }

[lints]
workspace = true
