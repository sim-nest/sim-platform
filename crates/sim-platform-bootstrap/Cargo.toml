[package]
name = "sim-platform-bootstrap"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded bootstrap rind for one content-bound SIM platform capsule"
publish = true

[package.metadata.sim]
role = "platform-bootstrap"

[dependencies]
sha2 = "0.10"
sim-kernel = "0.2.1"
sim-platform-core = { version = "0.1.0", path = "../sim-platform-core" }
sim-run-loaders = { version = "0.2.0", features = ["dynamic-native"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
