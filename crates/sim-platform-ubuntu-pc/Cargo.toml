[package]
name = "sim-platform-ubuntu-pc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Ubuntu PC reference platform capsule"
publish = false

[package.metadata.sim]
role = "platform-capsule"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sim-platform-core = { path = "../sim-platform-core" }
sim-platform-linux = { path = "../sim-platform-linux" }
sim-lib-exec = "0.2.0"
sim-kernel = "0.2.1"
sim-run-loaders = { version = "0.2.0", features = ["codec-binary", "codec-lisp", "dynamic-native", "wasm"] }
sim-wasm-abi = "0.3.0"

[dev-dependencies]
sim-platform-model = { path = "../sim-platform-model" }
sim-kernel = { version = "0.2.1", features = ["test-support"] }

[lints]
workspace = true
