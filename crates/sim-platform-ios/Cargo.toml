[package]
name = "sim-platform-ios"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "iOS AOT platform capsule and thin shell contract"
publish = false

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[package.metadata.sim]
role = "platform-capsule"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sim-codec-binary = "0.3.0"
sim-kernel = "0.3.0"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
pedantic = "warn"
