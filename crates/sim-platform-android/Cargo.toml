[package]
name = "sim-platform-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Android AOT platform capsule and thin shell contract"
publish = false

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[package.metadata.sim]
role = "platform-capsule"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sim-platform-core = { path = "../sim-platform-core" }

[lints]
workspace = true
