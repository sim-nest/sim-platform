[package]
name = "sim-platform-linux"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Bounded Linux mechanics for SIM platform capsules"
publish = true

[package.metadata.sim]
role = "platform-capsule"

[dependencies]
serde = { version = "1", features = ["derive"] }
sim-kernel = { version = "0.3.0" }
sim-platform-core = { version = "0.1.0", path = "../sim-platform-core" }
sim-lib-server = { version = "0.2.0" }
sim-transport-ports = { version = "0.1.0" }

[lints]
workspace = true
