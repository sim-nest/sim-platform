[package]
name = "sim-platform-wasi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Least-authority WASI component capsule for SIM"
publish = false

[package.metadata.sim]
role = "platform-capsule"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sim-platform-core = { path = "../sim-platform-core" }
sim-wasm-abi = "0.3.0"
wasmparser = "0.228"

[dev-dependencies]
sim-kernel = "0.2.1"
wat = "1"

[lints]
workspace = true
