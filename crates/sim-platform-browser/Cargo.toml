[package]
name = "sim-platform-browser"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Capability-honest browser Wasm capsule and byte-frame host membrane"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[package.metadata.sim]
role = "platform-capsule"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sim-codec-binary = "0.2.0"
sim-kernel = "0.2.1"

[lints]
workspace = true
