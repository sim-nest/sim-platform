[package]
name = "sim-platform-web-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Native Linux process capsule for the host-neutral SIM web shell"
publish = false

[[bin]]
name = "sim-web-shell"
path = "src/main.rs"

[package.metadata.sim]
role = "platform-capsule"

[dependencies]
sim = { package = "sim-nest", version = "0.2.2", features = [
  "cookbook-all",
  "standard-gc-tracing",
] }
sim-lib-cookbook = { version = "0.2.0" }
sim-lib-server = { version = "0.2.0" }
sim-platform-linux = { path = "../sim-platform-linux" }
sim-run-core = { version = "0.4.0" }
sim-transport-ports = { version = "0.1.0" }
sim-web-shell = { version = "0.2.0" }

[lints]
workspace = true
