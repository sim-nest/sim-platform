[package]
name = "sim-platform-midi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Native MIDI realization for SIM platform capsules."
publish = true

[features]
default = []
native-midi = ["dep:midir", "dep:zbus"]

[dependencies]
sim-lib-midi-core = "0.2.0"
midir = { version = "0.11", optional = true, default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", optional = true }

[lints]
workspace = true
