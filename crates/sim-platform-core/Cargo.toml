[package]
name = "sim-platform-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure manifest and package-role contracts for SIM platform capsules"
publish = false

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
sim-codec = "0.1.0"
sim-codec-binary = "0.2.0"
sim-codec-json = "0.2.0"
sim-codec-lisp = "0.2.0"
sim-kernel = { version = "0.2.0", features = ["test-support"] }

[lints]
workspace = true
